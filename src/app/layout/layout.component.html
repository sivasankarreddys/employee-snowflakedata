<header class="app-header">
  <div class="header-left">
    <h1>Employee Management System</h1>
  </div>

  <div class="header-right" *ngIf="!isLoginPage()">
    <span>👤 Welcome, {{username}}</span>
    <span class="time">🕒 {{ currentTime }}</span>
    <button (click)="logout()">Logout</button>
  </div>
</header>

<!-- NAVIGATION TABS -->
<nav class="nav-tabs" *ngIf="!isLoginPage()">
  <a routerLink="/search" routerLinkActive="active">🔍 Search Employee</a>
  <a routerLink="/add" routerLinkActive="active">➕ Add Employee</a>
  <a routerLink="/list" routerLinkActive="active">📋 Employees</a>
</nav>

<!-- MAIN CONTENT -->
<div class="main-content">
  <router-outlet></router-outlet>
</div>

<!-- FOOTER -->
<footer class="app-footer">
  © 2026 Employee Management System | All Rights Reserved
</footer>
