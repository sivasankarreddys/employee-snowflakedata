<div class="login-wrapper">
  <div class="login-card">
    <h2>Login</h2>

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" name="username" placeholder="Enter username" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="Enter password" />
    </div>

    <button (click)="login()">Login</button>
  </div>
    <div class="error" *ngIf="loginError">
    Invalid credentials.
    <a routerLink="/signup">Register here</a>
  </div>
</div>
